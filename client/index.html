<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoAuthor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>🖋️ CoAuthor</h1>
    <input type="text" id="searchInput" placeholder="Search rooms...">
    <div id="headerButtons">
      <button id="createRoomBtn">+ Create Room</button>
      <button id="loginBtn">Login</button>
    </div>
  </header>

  <main>
    <div id="roomsContainer">
      <table id="roomTable">
        <thead>
          <tr>
            <th>Room</th>
            <th>Members</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <div id="createRoomModal" class="modal">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <h2>Create New Room</h2>
      <input type="text" id="newRoomName" placeholder="Enter room name...">
      <button id="confirmCreateRoom">Create</button>
    </div>
  </div>

  <div id="loginModal" class="modal">
    <div class="modal-content">
      <span id="closeLoginModal" class="close">&times;</span>
      <h2>Login</h2>
      <input type="text" id="loginUsername" placeholder="Username">
      <input type="password" id="loginPassword" placeholder="Password">
      <button id="loginSubmitBtn">Login</button>
      <h3>Or create a new account</h3>
      <input type="text" id="newUsername" placeholder="New Username">
      <input type="password" id="newPassword" placeholder="Password">
      <button id="createAccountSubmitBtn">Create Account</button>
    </div>
  </div>

  <footer>
    <p>© 2025 CoAuthor • Collaborate. Create. Inspire.</p>
  </footer>

  <script src="/static/app.js" defer></script>
</body>
</html>
