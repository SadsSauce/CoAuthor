<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoAuthor - Rooms</title>
  <link rel="stylesheet" href="/static/rooms.css?v=11.0">
</head>
<body>
  <header>
    <div class="header-left">
      <a href="/genres" class="logo-link">🖋️ CoAuthor</a>
      <nav class="breadcrumb">
        <a href="/genres" id="backToGenres">← Genres</a>
        <span class="separator">/</span>
        <span id="currentGenre">Genre</span>
      </nav>
    </div>
    <div id="headerButtons">
      <button id="createRoomBtn">+ Create Story</button>
      <button id="loginBtn">Logout</button>
    </div>
  </header>

  <main>
    <div class="controls">
      <div class="filter-tabs">
        <button class="tab-btn active" data-filter="all">All Rooms</button>
        <button class="tab-btn" data-filter="my">My Rooms</button>
        <button class="tab-btn" data-filter="popular">Popular</button>
      </div>
      
      <div class="sort-dropdown">
        <label for="sortBy">Sort by:</label>
        <select id="sortBy">
          <option value="recent">Most Recent</option>
          <option value="active">Most Active</option>
          <option value="popular">Most Popular</option>
        </select>
      </div>
    </div>

    <div id="roomsContainer" class="rooms-grid">
      <!-- Room cards will be loaded here -->
    </div>

    <div id="emptyState" class="empty-state" style="display: none;">
      <p>No rooms found in this genre yet.</p>
      <button onclick="document.getElementById('createRoomBtn').click()">Create the first one!</button>
    </div>
  </main>

  <!-- Create Room Modal -->
  <div id="createRoomModal" class="modal">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <h2>Create New Story</h2>
      
      <form id="createRoomForm">
        <input type="text" id="roomName" placeholder="Story Title *" required>
        
        <textarea id="roomDescription" placeholder="Brief description of your story *" rows="3" required></textarea>
        
        <select id="roomGenre" required>
          <option value="">Select Genre *</option>
        </select>
        
        <select id="roomSize" required>
          <option value="">Max Collaborators *</option>
        </select>
        
        <div class="privacy-options">
          <label>
            <input type="radio" name="privacy" value="public" checked>
            Public (Anyone can join)
          </label>
          <label>
            <input type="radio" name="privacy" value="private">
            Private (Invite only)
          </label>
        </div>
        
        <button type="submit" id="confirmCreateRoom">Create Story</button>
      </form>
    </div>
  </div>

  <footer>
    <p>© 2025 CoAuthor • Collaborate. Create. Inspire.</p>
  </footer>

  <script src="/static/rooms.js?v=2.0" defer></script>
</body>
</html>
